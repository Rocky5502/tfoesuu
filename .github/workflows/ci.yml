name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pip install -e .
      - run: pytest -q
      - run: python scripts/check_bibliography.py
      - run: python scripts/check_paper_consistency.py
      - run: python scripts/freeze_submission_artifacts.py --require-clean --output /tmp/submission_manifest.json
      - run: python scripts/generate_benchmark.py --output /tmp/benchmark_v1.jsonl
      - run: python scripts/generate_replay_benchmark.py --output /tmp/replay_benchmark_v1.jsonl
      - run: python scripts/generate_subject_benchmark.py --output /tmp/software_subject_benchmark_v1.jsonl
      - run: python scripts/generate_counterfactual_benchmark.py --output /tmp/counterfactual_replay_benchmark_v1.jsonl
      - run: python scripts/generate_partial_replay_benchmark.py --output /tmp/partial_replay_benchmark_v1.jsonl
      - run: python scripts/generate_partial_replay_structural_cases.py --output /tmp/partial_replay_structural_cases_v1.jsonl
      - run: python scripts/generate_partial_replay_scope_cases.py --output /tmp/partial_replay_scope_cases_v1.jsonl
      - run: python experiments/validate_partial_replay_manifest.py --benchmark data/partial_replay_benchmark_v1.jsonl
      - run: python experiments/run_gaussian_core.py --graph star --n 8 --trials 500 --gamma 0.7 --beta 0.05
      - run: python experiments/run_replay_separation.py --p 0.5 --d 0.05 --beta 0.05 --trials 1000
      - run: python experiments/run_location_replay.py --candidates 8 --p 0.5 --d 0.05 --beta 0.05 --trials 1000
      - run: python experiments/run_allocator_subject.py --contexts 8 --changed-context 2 --delta 0.05 --beta 0.05 --trials 1000
      - run: python experiments/search_graph_replay_complexity.py --max-n 5 --top 5
      - run: python experiments/search_partial_replay_gap.py --n 5 --max-group-size 3
      - run: python experiments/run_counterfactual_replay.py --p 0.35 --shared-patch 0.20 --d 0.05 --beta 0.05 --trials 1000
