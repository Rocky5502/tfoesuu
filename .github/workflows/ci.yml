name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  reviewer-cpu:
    name: Reviewer CPU checks and evidence validation
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install research package and CPU tests
        run: python -m pip install -e ".[dev]"
      - name: Compile Python sources
        run: python -m compileall -q src scripts experiments tests reproducibility
      - name: Run scoped unit and adversarial regression tests
        run: python -m pytest -q
      - name: Validate deterministic benchmark inventory
        run: python scripts/validate_benchmark_inventory.py
      - name: Validate P17 and P19 legal-group fixtures
        run: |
          python experiments/validate_partial_replay_manifest.py --benchmark data/partial_replay_benchmark_v1.jsonl
          python experiments/validate_control_replay_manifest.py --benchmark data/control_replay_structural_cases_v1.jsonl
      - name: Verify archived P12/P15 against exact finite laws
        run: python scripts/validate_preview_results.py reproducibility/p12_p15/evidence/p12_p15_100k_preview_manifest_v1.json --base-dir reproducibility/p12_p15
      - name: Verify P19 independent CPU supplement
        run: python -m pytest -q reproducibility/p19_simple_null/test_p19_audit.py
      - name: Verify exact shared-nuisance supplement
        working-directory: reproducibility/unknown_shared_nuisance
        run: python -m unittest -q test_exact_witness_audit.py
      - name: Bounded Gaussian and replay demonstrations
        run: |
          python experiments/run_gaussian_core.py --graph star --n 8 --trials 500 --gamma 0.7 --beta 0.05
          python experiments/run_replay_separation.py --p 0.5 --d 0.05 --beta 0.05 --trials 1000
