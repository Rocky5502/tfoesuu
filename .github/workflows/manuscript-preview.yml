name: manuscript-preview

on:
  push:
    branches:
      - automation/manuscript-preview-20261008
    paths:
      - .github/workflows/manuscript-preview.yml

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LaTeX dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk texlive-latex-base texlive-latex-extra \
            texlive-pictures texlive-fonts-recommended texlive-science
      - name: Compile current main-derived manuscript sources
        working-directory: paper
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
      - name: Confirm compiled PDF is nonempty
        run: test -s paper/main.pdf
      - uses: actions/upload-artifact@v4
        with:
          name: tfoesuu-current-main-preview-pdf
          path: paper/main.pdf
          if-no-files-found: error
