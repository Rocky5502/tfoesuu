<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc">
<title id="title">TFOESUU: scope-aware fairness regression testing</title>
<desc id="desc">The workflow reuses a certified baseline, prunes provably safe comparisons, declares a legal replay observation contract, and applies only a valid statistical test. Three distinct families are Gaussian paired differences, synchronized Bernoulli replay, and legal partial-replay groups.</desc>
<rect width="1200" height="580" fill="#ffffff"/>
<text x="36" y="45" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#112334">Certificate-aware fairness testing</text>
<text x="36" y="70" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#475569">Reuse prior evidence only when change bounds and legal replay semantics justify it.</text>
